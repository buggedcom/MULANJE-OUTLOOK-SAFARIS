name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'demo1/**'
      - 'demo2/**'
      - 'demo3/**'
      - 'demo4/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r demo1/. _site/
          mkdir -p _site/demo2
          cp -r demo2/. _site/demo2/
          mkdir -p _site/demo3
          cp -r demo3/. _site/demo3/
          mkdir -p _site/demo4
          cp -r demo4/. _site/demo4/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
