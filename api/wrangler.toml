name = "mulanje-contact-api"
main = "src/index.ts"
compatibility_date = "2025-02-14"

# Comma-separated list of origins allowed to call the API. Add the deployed
# site origin (GitHub Pages: https://<user>.github.io) before deploying.
[vars]
ALLOWED_ORIGINS = "http://localhost:5173"
MAIL_TO = "info@example.com"
MAIL_FROM = "Mulanje Outlook <enquiries@example.com>"

[[durable_objects.bindings]]
name = "GUARD"
class_name = "Guard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Guard"]

# Secrets (never commit): set with `wrangler secret put <NAME>`
#   TOKEN_SECRET     - 32+ random bytes, e.g. `openssl rand -base64 48`
#   RESEND_API_KEY   - Resend API key
